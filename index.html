<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Store - Free Fire Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

<style>
:root {
  --ff-cyan: #00acc1;
  --ff-cyan-glow: rgba(0, 172, 193, 0.4);
  --dark-bg: #0d1117;
  --card-bg: #161b22;
  --border-color: #30363d;
  --accent-gradient: linear-gradient(45deg, #ff3b3b, #ff7b00);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background-color: var(--dark-bg);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

.container {
  padding: 40px 15px;
  width: 100%;
  max-width: 1100px;
  text-align: center;
}

.title {
  font-family: 'Orbitron', sans-serif;
  font-size: 2rem;
  margin-bottom: 30px;
}

.search-section {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
}

.search-section input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  background: #0d1117;
  color: white;
  border: 1px solid var(--border-color);
}

.btn-verify {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: var(--accent-gradient);
  color: white;
  cursor: pointer;
}

#status-msg { margin-bottom: 20px; }

.diamond-grid {
  display: none;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.diamond-card {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 15px;
}

.btn-buy {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: var(--ff-cyan);
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container">
  <h1 class="title">RECARGA DIAMANTES</h1>

  <div class="search-section">
    <input type="text" id="uid" placeholder="Ingresa tu ID de Jugador">
    <button class="btn-verify" onclick="buscarPlayer()">BUSCAR</button>
  </div>

  <div id="status-msg"></div>

  <div id="diamond-grid" class="diamond-grid">

    <div class="diamond-card">
      <h3>110 Diamantes</h3>
      <p>$1</p>
      <button class="btn-buy" onclick="comprar(110)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>341 Diamantes</h3>
      <p>$3600</p>
      <button class="btn-buy" onclick="comprar(341)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>572 Diamantes</h3>
      <p>$5800</p>
      <button class="btn-buy" onclick="comprar(572)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>1166 Diamantes</h3>
      <p>$11500</p>
      <button class="btn-buy" onclick="comprar(1166)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>2398 Diamantes</h3>
      <p>$19800</p>
      <button class="btn-buy" onclick="comprar(2398)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>6160 Diamantes</h3>
      <p>$47000</p>
      <button class="btn-buy" onclick="comprar(6160)">COMPRAR</button>
    </div>

  </div>
</div>

<script>
// 🔎 Buscar jugador
async function buscarPlayer() {
  const uid = document.getElementById("uid").value.trim();
  const status = document.getElementById("status-msg");
  const grid = document.getElementById("diamond-grid");

  if (!uid) {
    status.innerHTML = "❌ Ingresa tu ID";
    return;
  }

  status.innerHTML = "🔎 Verificando...";

  try {
    const res = await fetch(`https://frequencies-ordering-gore-geometry.trycloudflare.com/api/player?uid=${uid}`);
    const data = await res.json();

    if (data.status === "ok") {
      status.setAttribute("data-nickname", data.nickname);
      status.innerHTML = `✅ ${data.nickname}`;
      grid.style.display = "grid";
    } else {
      status.innerHTML = "❌ ID no encontrado";
    }
  } catch {
    status.innerHTML = "⚠️ Error de conexión";
  }
}

// 💎 Comprar → WhatsApp
function comprar(cantidad) {
  const uid = document.getElementById("uid").value;
  const statusMsg = document.getElementById("status-msg");
  const nickname = statusMsg.getAttribute("data-nickname") || "Jugador";

  if (!uid) {
    alert("Primero ingresá tu ID");
    return;
  }

  const precios = {
    110: 1,
    341: 3600,
    572: 5800,
    1166: 11500,
    2398: 19800,
    6160: 47000
  };

  const monto = precios[cantidad];

  const mensaje = `💎 PEDIDO


🆔 ID: ${uid}
📦 Pack: ${cantidad}
💰 Precio: $${monto}
💳 Pago: Transferencia / Mercado Pago / Otro`;

  const url = `https://wa.me/543517016162?text=${encodeURIComponent(mensaje)}`;

  window.open(url, "_blank");
}

// 🎨 Fondo animado
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let particles = [];

function init() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = [];

  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      dx: (Math.random()-0.5),
      dy: (Math.random()-0.5)
    });
  }
}

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    ctx.fillRect(p.x,p.y,2,2);
    p.x+=p.dx;
    p.y+=p.dy;
  });
  requestAnimationFrame(animate);
}

init();
animate();
</script>

</body>
</html>
