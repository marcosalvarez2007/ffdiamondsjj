<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Store - Free Fire Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

<style>
:root {
  --ff-cyan: #00acc1;
  --ff-cyan-glow: rgba(0, 172, 193, 0.4);
  --dark-bg: #0d1117;
  --card-bg: #161b22;
  --border-color: #30363d;
  --accent-gradient: linear-gradient(45deg, #ff3b3b, #ff7b00);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background-color: var(--dark-bg);
  color: white;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
  background: radial-gradient(circle at center, #111e2d 0%, #0d1117 100%);
}

.container {
  padding: 40px 15px;
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  letter-spacing: 2px;
  margin-bottom: 30px;
  text-transform: uppercase;
  background: linear-gradient(to bottom, #ffffff, #888);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.search-section {
  background: rgba(255, 255, 255, 0.03);
  padding: 20px;
  border-radius: 20px;
  border: 1px solid var(--border-color);
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: row;
  gap: 10px;
  width: 100%;
  max-width: 500px;
  margin-bottom: 40px;
}

.search-section input {
  flex: 1;
  padding: 15px;
  border-radius: 12px;
  background: #0d1117;
  color: white;
  border: 1px solid var(--border-color);
}

.btn-verify {
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: var(--accent-gradient);
  color: white;
  cursor: pointer;
}

#status-msg { margin-bottom: 20px; }

.diamond-grid {
  display: none;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  width: 100%;
}

.diamond-card {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 15px;
}

.btn-buy {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: var(--ff-cyan);
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container">
  <h1 class="title">RECARGA DIAMANTES</h1>

  <div class="search-section">
    <input type="text" id="uid" placeholder="Ingresa tu ID">
    <button class="btn-verify" onclick="buscarPlayer()">BUSCAR</button>
  </div>

  <div id="status-msg"></div>

  <div id="diamond-grid" class="diamond-grid">

    <div class="diamond-card">
      <h3>110 Diamantes</h3>
      <p>$1</p>
      <button class="btn-buy" onclick="comprar(110)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>341 Diamantes</h3>
      <p>$3600</p>
      <button class="btn-buy" onclick="comprar(341)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>572 Diamantes</h3>
      <p>$5800</p>
      <button class="btn-buy" onclick="comprar(572)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>1166 Diamantes</h3>
      <p>$11500</p>
      <button class="btn-buy" onclick="comprar(1166)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>2398 Diamantes</h3>
      <p>$19800</p>
      <button class="btn-buy" onclick="comprar(2398)">COMPRAR</button>
    </div>

    <div class="diamond-card">
      <h3>6160 Diamantes</h3>
      <p>$47000</p>
      <button class="btn-buy" onclick="comprar(6160)">COMPRAR</button>
    </div>

  </div>
</div>

<script>
function buscarPlayer() {
  const uid = document.getElementById("uid").value.trim();
  const status = document.getElementById("status-msg");
  const grid = document.getElementById("diamond-grid");

  if (!uid) {
    status.innerHTML = "❌ Ingresa tu ID";
    return;
  }

  status.setAttribute('data-nickname', "Jugador");
  status.innerHTML = "✅ Jugador listo";
  grid.style.display = "grid";
}

function comprar(cantidad) {
  const uid = document.getElementById("uid").value;
  const statusMsg = document.getElementById("status-msg");
  const nickname = statusMsg.getAttribute('data-nickname') || "Jugador";

  const precios = {
    110: 1,
    341: 3600,
    572: 5800,
    1166: 11500,
    2398: 19800,
    6160: 47000
  };

  const monto = precios[cantidad];
  const metodo = "Transferencia / Mercado Pago";

  const mensaje = `💎 NUEVO PEDIDO

👤 Nick: ${nickname}
🆔 ID: ${uid}
📦 Paquete: ${cantidad}
💰 Monto: $${monto}
💳 Pago: ${metodo}`;

  const url = `https://wa.me/543517016162?text=${encodeURIComponent(mensaje)}`;

  window.open(url, "_blank");

  statusMsg.innerHTML = "✅ Enviando a WhatsApp...";
}

// fondo animado
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
let particles = [];

function init() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      dx: (Math.random() - 0.5),
      dy: (Math.random() - 0.5)
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    ctx.fillRect(p.x, p.y, 2, 2);
    p.x += p.dx;
    p.y += p.dy;
  });
  requestAnimationFrame(animate);
}

init();
animate();
</script>

</body>
</html>
