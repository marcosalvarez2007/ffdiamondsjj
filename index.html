// ==========================
// BUSCAR PLAYER (igual)
// ==========================
async function buscarPlayer() {

  const uid = document.getElementById("uid").value;
  const status = document.getElementById("status-msg");

  if (!uid) {
    status.innerHTML = "❌ Ingresa ID";
    return;
  }

  status.innerHTML = "Buscando...";

  try {
    const res = await fetch(`https://pilot-tin-computation-relevance.trycloudflare.com/api/player?uid=${uid}`);
    const data = await res.json();

    if (data.status === "ok") {
      status.setAttribute("data-nickname", data.nickname);
      status.innerHTML = "✅ " + data.nickname;
    } else {
      status.innerHTML = "❌ No encontrado";
    }

  } catch {
    status.innerHTML = "Error conexión";
  }
}
